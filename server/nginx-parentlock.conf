# Separate virtual host; does not touch other sites on the server.
# deploy.sh replaces parent.example.com with PARENTLOCK_DOMAIN; certbot then adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name parent.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
